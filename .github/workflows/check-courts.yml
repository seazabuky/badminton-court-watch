name: Check courts

on:
  schedule:
    # ทุกวัน วันละ 3 รอบ: 06:17 / 12:17 / 18:17 เวลาไทย (23:17 / 05:17 / 11:17 UTC)
    # GitHub มักเลื่อนรอบ schedule ไปหลายชั่วโมง การรันหลายรอบช่วยให้ข้อมูลสดเสมอ
    - cron: "17 23,5,11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: check-courts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TZ: Asia/Bangkok
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # ต้องใช้ประวัติเพื่อเทียบกับข้อมูลเมื่อวาน

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Find adjacent free courts
        run: |
          set -o pipefail
          python find_court_pairs.py --only-on any --state state.json --json latest.json 2>&1 | tee report.txt
          {
            echo '```'
            cat report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build phone message
        run: |
          # เทียบกับข้อมูลเมื่อ ~1 วันก่อน (ข้อความแจ้งเตือนส่งวันละครั้ง)
          PREV=$(git rev-list -1 --before="20 hours ago" HEAD -- latest.json)
          python notify_text.py --from 15:00 --to 19:00 --prev "git:${PREV:-HEAD}" > message.txt
          cat message.txt

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json latest.json message.txt
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Update court availability $(date '+%Y-%m-%d %H:%M')"
            git push
          fi
